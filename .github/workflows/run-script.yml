name: Run Starbucks Automation via Email Webhook

on:
  repository_dispatch:
    types: [trigger-starbucks-signup]
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to sign up'
        required: true
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Extract Email from Webhook Payload or Manual Input
        run: |
          # Get email from repository_dispatch (webhook) or workflow_dispatch (manual UI)
          EMAIL="${{ github.event.client_payload.email }}"
          if [ -z "$EMAIL" ]; then
            EMAIL="${{ github.event.inputs.email }}"
          fi

          echo "Target Email received: $EMAIL"

          # Create a dynamic users.csv on the fly for this single run
          # (Modify first_name, last_name, and password as needed or keep them default)
          echo "first_name,last_name,email,password" > users.csv
          echo "John,Doe,$EMAIL,Sainaren@94" >> users.csv

          echo "Generated temporary users.csv:"
          cat users.csv

      - name: Run Starbucks Automation Script
        run: python starbucks_signup_fixed.py --headless --limit 1
